<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9x9 Grid</title>
  <style>
    @font-face {
      font-family: 'NameSmile';
      src: url('Name Smile.otf') format('opentype');
    }

    /* Declare animatable percentage custom property */
    @property --mix {
      syntax: '<percentage>';
      inherits: false;
      initial-value: 0%;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
      overflow: hidden;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      width: min(100vw, 100vh);
      height: min(100vw, 100vh);
      gap: 1px;
    }

    .grid-cell {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .letter {
      font-family: 'NameSmile', monospace;
      font-size: calc(min(100vw, 100vh) / 10);
      text-transform: uppercase;
      --from: oklch(0.3 0 0);
      /* Default gray */
      --to: oklch(0.3 0 0);
      /* Default gray */
      --mix: 0%;
      color: color-mix(in oklch shorter hue, var(--from) calc(100% - var(--mix)), var(--to) var(--mix));
      transition: --mix 1000ms linear;
    }


    @supports (text-box-trim: trim-both) {
      .letter {
        text-box: trim-both cap alphabetic;
      }
    }
  </style>
</head>

<body>
  <div class="grid-container">
    <!-- Grid cells will be generated by JavaScript -->
  </div>

  <script>
    const gridContainer = document.querySelector('.grid-container');

    // Define the letters layout in uppercase
    const LETTERS = [
      "TENTWENTY",
      "ATQUARTER",
      "FIVEKHALF",
      "PASTOETEN",
      "FOURSEVEN",
      "TWELVESIX",
      "NINELEVEN",
      "THREEFIVE",
      "EIGHTWONE"
    ];

    // Convert to single string of all letters
    const allLetters = LETTERS.join('');

    // Store letter elements and their color states
    const letterElements = [];
    const letterColors = [];

    // Generate 81 cells (9x9) with letters
    for (let i = 0; i < 81; i++) {
      const cell = document.createElement('div');
      cell.className = 'grid-cell';

      // Add the letter wrapped in a span
      const letterSpan = document.createElement('span');
      letterSpan.className = 'letter';
      letterSpan.textContent = allLetters[i];
      cell.appendChild(letterSpan);

      gridContainer.appendChild(cell);

      // Store reference to letter element
      letterElements.push(letterSpan);

      // Initialize color state
      letterColors.push({
        current: 'oklch(0.3 0 0)',  // Gray in OKLCH
        next: null
      });

      // Set initial CSS custom properties
      letterSpan.style.setProperty('--from', letterColors[i].current);
      letterSpan.style.setProperty('--to', letterColors[i].current);
    }

    // Function to set the next color for a specific letter
    function setNextColor(letterIndex, nextColor) {
      if (letterIndex >= 0 && letterIndex < letterColors.length) {
        letterColors[letterIndex].next = nextColor;
        letterElements[letterIndex].style.setProperty('--to', nextColor);
      }
    }

    // Function to set next colors for all letters
    function setAllNextColors(colors) {
      colors.forEach((color, index) => {
        if (index < letterColors.length) {
          setNextColor(index, color);
        }
      });
    }

    // Use transition instead of animation
    function startFadeTransition(duration = 1000) {
      // First ensure --mix is at 0% without transition
      letterElements.forEach(element => {
        element.style.transition = 'none';
        element.style.setProperty('--mix', '0%');
      });

      // Then set up the transition and trigger it
      requestAnimationFrame(() => {
        letterElements.forEach(element => {
          element.style.transition = `--mix ${duration}ms linear`;
          element.style.setProperty('--mix', '100%');
        });
      });

      // After transition completes, update the current colors
      setTimeout(() => {
        letterElements.forEach((element, index) => {
          if (letterColors[index].next) {
            letterColors[index].current = letterColors[index].next;
            letterColors[index].next = null;
            // Swap colors for next transition
            element.style.setProperty('--from', letterColors[index].current);
            element.style.setProperty('--to', letterColors[index].current);
            element.style.transition = 'none';
            element.style.setProperty('--mix', '0%');
          }
        });
      }, duration);
    }


    // Fade duration for color transitions
    const FADE_DURATION = 4000;

    // Word to letter indices mapping
    const TIME_WORDS = {
      // A
      'a': [9],

      // Minutes
      'five_min': [18, 19, 20, 21],      // FIVE (row 3)
      'ten_min': [0, 1, 2],               // TEN (row 1)
      'quarter': [11, 12, 13, 14, 15, 16, 17], // QUARTER (row 2)
      'twenty': [3, 4, 5, 6, 7, 8],      // TWENTY (row 1)
      'half': [23, 24, 25, 26],      // HALF (row 3)

      // Past/To
      'past': [27, 28, 29, 30],          // PAST (row 4)
      'to': [30, 31],                    // TO (row 4)

      // Hours
      'one': [78, 79, 80],               // ONE (row 9)
      'two': [76, 77, 78],               // TWO (row 9)
      'three': [63, 64, 65, 66, 67],    // THREE (row 8)
      'four': [36, 37, 38, 39],         // FOUR (row 5)
      'five_hour': [68, 69, 70, 71],    // FIVE (row 8)
      'six': [51, 52, 53],               // SIX (row 6)
      'seven': [40, 41, 42, 43, 44],    // SEVEN (row 5)
      'eight': [72, 73, 74, 75, 76],    // EIGHT (row 9)
      'nine': [54, 55, 56, 57],         // NINE (row 7)
      'ten_hour': [33, 34, 35],         // TEN (row 4)
      'eleven': [57, 58, 59, 60, 61, 62],   // ELEVEN (row 7)
      'twelve': [45, 46, 47, 48, 49, 50] // TWELVE (row 6)
    };

    function getTimeWords(date) {
      let hours = date.getHours();
      let minutes = date.getMinutes();

      // Round to nearest 5 minutes based on seconds
      const seconds = date.getSeconds();
      const totalMinutes = minutes + (seconds / 60);
      minutes = Math.round(totalMinutes / 5) * 5;

      // Handle hour overflow when rounding
      if (minutes === 60) {
        minutes = 0;
        hours = (hours + 1) % 24;
      }

      // Convert to 12-hour format
      let displayHour = hours % 12;
      if (displayHour === 0) displayHour = 12;

      const words = [];

      // Determine minute words
      if (minutes === 0) {
        // On the hour - just show the hour
      } else if (minutes === 5) {
        words.push('five_min', 'past');
      } else if (minutes === 10) {
        words.push('ten_min', 'past');
      } else if (minutes === 15) {
        words.push('a', 'quarter', 'past');
      } else if (minutes === 20) {
        words.push('twenty', 'past');
      } else if (minutes === 25) {
        words.push('twenty', 'five_min', 'past');
      } else if (minutes === 30) {
        words.push('half', 'past');
      } else if (minutes === 35) {
        words.push('twenty', 'five_min', 'to');
        displayHour = (displayHour % 12) + 1; // Next hour
      } else if (minutes === 40) {
        words.push('twenty', 'to');
        displayHour = (displayHour % 12) + 1;
      } else if (minutes === 45) {
        words.push('a', 'quarter', 'to');
        displayHour = (displayHour % 12) + 1;
      } else if (minutes === 50) {
        words.push('ten_min', 'to');
        displayHour = (displayHour % 12) + 1;
      } else if (minutes === 55) {
        words.push('five_min', 'to');
        displayHour = (displayHour % 12) + 1;
      }

      // Add hour word
      const hourWords = {
        1: 'one', 2: 'two', 3: 'three', 4: 'four',
        5: 'five_hour', 6: 'six', 7: 'seven', 8: 'eight',
        9: 'nine', 10: 'ten_hour', 11: 'eleven', 12: 'twelve'
      };

      words.push(hourWords[displayHour]);

      return words;
    }

    function generateTimeColors(timeWords) {
      const colors = [];
      const wordToColor = new Map();

      // Generate a random color for each word
      timeWords.forEach(word => {
        if (TIME_WORDS[word]) {
          // Random hue (0-360), constant chroma (0.2 for vibrant colors), constant bright lightness (0.75)
          const hue = Math.random() * 360;
          const randomColor = `oklch(0.75 0.2 ${hue})`;
          wordToColor.set(word, randomColor);
        }
      });

      // Assign colors to all letters
      for (let i = 0; i < 81; i++) {
        let letterColor = 'oklch(0.3 0 0)'; // Default gray for inactive letters

        // Check if this index belongs to any active word
        for (const word of timeWords) {
          if (TIME_WORDS[word] && TIME_WORDS[word].includes(i)) {
            letterColor = wordToColor.get(word);
            break;
          }
        }

        colors.push(letterColor);
      }

      return colors;
    }

    let lastDisplayedWords = [];
    let updateTimeout = null;

    function showTime(date, fadeDuration = FADE_DURATION) {
      const timeWords = getTimeWords(date);

      // Update current time and last displayed words
      lastDisplayedWords = timeWords;

      const colors = generateTimeColors(timeWords);

      setAllNextColors(colors);

      startFadeTransition(fadeDuration);
    }

    function clearUpdateTimeout() {
      if (updateTimeout) {
        clearTimeout(updateTimeout);
        updateTimeout = null;
      }
    }

    function scheduleNextUpdate() {
      // Clear any existing timeout
      clearUpdateTimeout();

      const now = new Date();

      const msPerMinute = 60 * 1000;
      const msPerFiveMinutes = 5 * msPerMinute;

      // Find the next 5-minute mark (e.g., 12:05, 12:10, 12:15)
      const msSinceHour = (now.getMinutes() * msPerMinute) + (now.getSeconds() * 1000) + now.getMilliseconds();

      const msToNextFiveMinute = msPerFiveMinutes - (msSinceHour % msPerFiveMinutes);

      // Schedule update 150 seconds + FADE_DURATION/2 before the 5-minute mark
      const earlyOffset = (150 * 1000) + (FADE_DURATION / 2);

      const msUntilUpdate = msToNextFiveMinute - earlyOffset;

      // If the calculated time is negative, add 5 minutes
      const finalDelay = msUntilUpdate > 0 ? msUntilUpdate : msUntilUpdate + msPerFiveMinutes;

      const nextUpdateTime = new Date(Date.now() + finalDelay);

      updateTimeout = setTimeout(() => {
        // Show time 150 seconds in the future (which will round to the next 5-minute mark unless fade duration is huge)
        const futureTime = new Date(Date.now() + 150 * 1000);

        showTime(futureTime);

        // Schedule the next update
        scheduleNextUpdate();
      }, finalDelay);
    }

    // Check if we're in the early update window
    const now = new Date();
    const msPerMinute = 60 * 1000;
    const msPerFiveMinutes = 5 * msPerMinute;
    const msSinceHour = (now.getMinutes() * msPerMinute) + (now.getSeconds() * 1000) + now.getMilliseconds();
    const msUntilNextFiveMinute = msPerFiveMinutes - (msSinceHour % msPerFiveMinutes);
    const earlyOffset = (150 * 1000) + (FADE_DURATION / 2);

    // If we're within the early update window, show the future time
    if (msUntilNextFiveMinute < earlyOffset) {
      // Calculate how far into the future we should be showing
      const msIntoFuture = earlyOffset - msUntilNextFiveMinute;
      const futureTime = new Date(Date.now() + (150 * 1000));
      showTime(futureTime, 0);
    } else {
      showTime(now, 0);
    }

    scheduleNextUpdate();

    // Update to current time on window focus
    window.addEventListener('focus', () => {
      const now = new Date();

      const nowWords = getTimeWords(now);

      // Check if the time words have changed
      const wordsChanged = nowWords.length !== lastDisplayedWords.length ||
        !nowWords.every((word, index) => word === lastDisplayedWords[index]);

      if (wordsChanged) {
        // Show current time without fade (0ms)
        showTime(now, 0);
      }

      // Restart the update schedule
      scheduleNextUpdate();
    });
  </script>
</body>

</html>
