<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9x9 Grid</title>
  <style>
    @font-face {
      font-family: 'NameSmile';
      src: url('Name Smile.otf') format('opentype');
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #222;
      overflow: hidden;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      width: min(100vw, 100vh);
      height: min(100vw, 100vh);
      gap: 1px;
      background-color: #111;
    }

    .grid-cell {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .letter {
      font-family: 'NameSmile', monospace;
      font-size: calc(min(100vw, 100vh) / 12);
      justify-content: center;
      align-items: center;
      text-transform: uppercase;
      border: 1px solid red;
      color: white;
    }

    @supports (text-box-trim: trim-both) {
      .grid-cell {
        text-box: trim-both cap alphabetic;
      }
    }
  </style>
</head>

<body>
  <div class="grid-container">
    <!-- Grid cells will be generated by JavaScript -->
  </div>

  <script>
    const gridContainer = document.querySelector('.grid-container');

    // Define the letters layout in uppercase
    const LETTERS = [
      "TENTWENTY",
      "ATQUARTER",
      "FIVEKHALF",
      "PASTOETEN",
      "FOURSEVEN",
      "TWELVESIX",
      "NINELEVEN",
      "THREEFIVE",
      "EIGHTWONE"
    ];

    // Convert to single string of all letters
    const allLetters = LETTERS.join('');

    // Generate 81 cells (9x9) with letters
    for (let i = 0; i < 81; i++) {
      const cell = document.createElement('div');
      cell.className = 'grid-cell';

      // Generate a unique background color for each cell using HSL
      const hue = (i * 360 / 81) % 360;
      const saturation = 50 + (i % 3) * 20;
      const lightness = 40 + (i % 5) * 10;
      cell.style.backgroundColor = `hsl(${hue}, ${saturation}%, ${lightness}%)`;

      // Add the letter
      cell.textContent = allLetters[i];

      gridContainer.appendChild(cell);
    }
  </script>
</body>

</html>
