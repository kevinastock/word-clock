<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9x9 Grid</title>
  <style>
    @font-face {
      font-family: 'NameSmile';
      src: url('Name Smile.otf') format('opentype');
    }

    /* Declare animatable percentage custom property */
    @property --mix {
      syntax: '<percentage>';
      inherits: false;
      initial-value: 0%;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
      overflow: hidden;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      width: min(100vw, 100vh);
      height: min(100vw, 100vh);
      gap: 1px;
    }

    .grid-cell {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .letter {
      font-family: 'NameSmile', monospace;
      font-size: calc(min(100vw, 100vh) / 10);
      text-transform: uppercase;
      --from: oklch(0.4 0 0);
      /* Default gray */
      --to: oklch(0.4 0 0);
      /* Default gray */
      --mix: 0%;
      color: color-mix(in oklch shorter hue, var(--from) calc(100% - var(--mix)), var(--to) var(--mix));
      transition: --mix 1000ms linear;
    }

    .letter.fading {
      --mix: 100%;
    }

    @keyframes oklch-fade {
      from {
        --mix: 0%;
      }

      to {
        --mix: 100%;
      }
    }

    .letter.animating {
      animation: oklch-fade var(--fade-duration, 1000ms) linear forwards;
    }

    @supports (text-box-trim: trim-both) {
      .letter {
        text-box: trim-both cap alphabetic;
      }
    }
  </style>
</head>

<body>
  <div class="grid-container">
    <!-- Grid cells will be generated by JavaScript -->
  </div>

  <script>
    const gridContainer = document.querySelector('.grid-container');

    // Define the letters layout in uppercase
    const LETTERS = [
      "TENTWENTY",
      "ATQUARTER",
      "FIVEKHALF",
      "PASTOETEN",
      "FOURSEVEN",
      "TWELVESIX",
      "NINELEVEN",
      "THREEFIVE",
      "EIGHTWONE"
    ];

    // Convert to single string of all letters
    const allLetters = LETTERS.join('');

    // Store letter elements and their color states
    const letterElements = [];
    const letterColors = [];

    // Generate 81 cells (9x9) with letters
    for (let i = 0; i < 81; i++) {
      const cell = document.createElement('div');
      cell.className = 'grid-cell';

      // Add the letter wrapped in a span
      const letterSpan = document.createElement('span');
      letterSpan.className = 'letter';
      letterSpan.textContent = allLetters[i];
      cell.appendChild(letterSpan);

      gridContainer.appendChild(cell);

      // Store reference to letter element
      letterElements.push(letterSpan);

      // Initialize color state
      letterColors.push({
        current: 'oklch(0.4 0 0)',  // Gray in OKLCH
        next: null
      });

      // Set initial CSS custom properties
      letterSpan.style.setProperty('--from', letterColors[i].current);
      letterSpan.style.setProperty('--to', letterColors[i].current);
    }

    // Function to set the next color for a specific letter
    function setNextColor(letterIndex, nextColor) {
      if (letterIndex >= 0 && letterIndex < letterColors.length) {
        letterColors[letterIndex].next = nextColor;
        letterElements[letterIndex].style.setProperty('--to', nextColor);
      }
    }

    // Function to set next colors for all letters
    function setAllNextColors(colors) {
      colors.forEach((color, index) => {
        if (index < letterColors.length) {
          setNextColor(index, color);
        }
      });
    }

    // Function to start the fade animation using CSS
    function startFade(duration = 1000) {
      // Set the fade duration CSS variable
      document.documentElement.style.setProperty('--fade-duration', `${duration}ms`);

      // Reset mix to 0% and add animation class
      letterElements.forEach((element, index) => {
        element.style.setProperty('--mix', '0%');
        element.classList.remove('animating');
        // Force reflow to restart animation
        void element.offsetWidth;
        element.classList.add('animating');
      });

      // After animation completes, update the current colors
      setTimeout(() => {
        letterElements.forEach((element, index) => {
          if (letterColors[index].next) {
            letterColors[index].current = letterColors[index].next;
            letterColors[index].next = null;
            // Set --from to the new current color for next animation
            element.style.setProperty('--from', letterColors[index].current);
            element.style.setProperty('--mix', '0%');
            element.classList.remove('animating');
          }
        });
      }, duration);
    }

    // Alternative: Use transition instead of animation
    function startFadeTransition(duration = 1000) {
      // First ensure --mix is at 0% without transition
      letterElements.forEach(element => {
        element.style.transition = 'none';
        element.style.setProperty('--mix', '0%');
      });

      // Then set up the transition and trigger it
      requestAnimationFrame(() => {
        letterElements.forEach(element => {
          element.style.transition = `--mix ${duration}ms linear`;
          element.style.setProperty('--mix', '100%');
        });
      });

      // After transition completes, update the current colors
      setTimeout(() => {
        letterElements.forEach((element, index) => {
          if (letterColors[index].next) {
            letterColors[index].current = letterColors[index].next;
            letterColors[index].next = null;
            // Swap colors for next transition
            element.style.setProperty('--from', letterColors[index].current);
            element.style.setProperty('--to', letterColors[index].current);
            element.style.transition = 'none';
            element.style.setProperty('--mix', '0%');
          }
        });
      }, duration);
    }

    // Example usage - create a rainbow effect
    function exampleRainbowFade() {
      const colors = [];
      for (let i = 0; i < 81; i++) {
        const hue = (i * 360 / 81) % 360;
        colors.push(`oklch(0.7 0.15 ${hue})`);
      }
      setAllNextColors(colors);
      startFade(2000);
    }

    // Example usage - random colors per letter
    function exampleRandomColors() {
      const colors = [];
      for (let i = 0; i < 81; i++) {
        const l = 0.4 + Math.random() * 0.4;  // Lightness between 0.4-0.8
        const c = Math.random() * 0.3;        // Chroma between 0-0.3
        const h = Math.random() * 360;        // Hue between 0-360
        colors.push(`oklch(${l} ${c} ${h})`);
      }
      setAllNextColors(colors);
      startFadeTransition(1500);
    }

    // Clock-based color fade system
    const FADE_DURATION = 5000; // X seconds in milliseconds
    const FADE_INTERVAL = 5 * 60 * 1000; // 5 minutes in milliseconds

    function generateRandomColors() {
      const colors = [];
      for (let i = 0; i < 81; i++) {
        const l = 0.4 + Math.random() * 0.4;  // Lightness between 0.4-0.8
        const c = Math.random() * 0.3;        // Chroma between 0-0.3
        const h = Math.random() * 360;        // Hue between 0-360
        colors.push(`oklch(${l} ${c} ${h})`);
      }
      return colors;
    }

    function triggerClockFade() {
      console.log(`Clock fade triggered at ${new Date().toLocaleTimeString()}`);
      setAllNextColors(generateRandomColors());
      startFadeTransition(FADE_DURATION);
    }

    function calculateNextFadeTime() {
      const now = new Date();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();
      const milliseconds = now.getMilliseconds();

      // Find next minute ending in 2 or 7
      const lastDigit = minutes % 10;
      let minutesToNext;

      if (lastDigit < 2) {
        minutesToNext = 2 - lastDigit;
      } else if (lastDigit < 7) {
        minutesToNext = 7 - lastDigit;
      } else {
        minutesToNext = 12 - lastDigit; // Next is X2 of next 10-minute cycle
      }

      // Calculate milliseconds to the target minute at 0:00.000
      let msToTargetMinute = (minutesToNext * 60 - seconds) * 1000 - milliseconds;

      // Add 28.5 seconds (28500 ms) to reach X:X2:28.5 or X:X7:28.5
      let msToFadeStart = msToTargetMinute + 28500;

      // If we've already passed this time, go to the next 5-minute interval
      if (msToFadeStart < 0) {
        // Add 5 minutes
        msToFadeStart += FADE_INTERVAL;
      }

      return msToFadeStart;
    }

    function scheduleNextFade() {
      const msToNext = calculateNextFadeTime();
      const nextFadeTime = new Date(Date.now() + msToNext);

      console.log(`Next fade scheduled for ${nextFadeTime.toLocaleTimeString()} (in ${Math.round(msToNext / 1000)} seconds)`);

      setTimeout(() => {
        triggerClockFade();
        scheduleNextFade(); // Schedule the next one
      }, msToNext);
    }

    // Start the clock fade system
    scheduleNextFade();

    // Trigger an initial fade only if we're not too close to a scheduled fade
    const msToNext = calculateNextFadeTime();
    const MIN_SAFE_INTERVAL = FADE_DURATION + 2000; // Don't trigger if within fade duration + 2s

    if (msToNext > MIN_SAFE_INTERVAL) {
      setTimeout(() => {
        console.log('Initial fade triggered');
        triggerClockFade();
      }, 1000);
    } else {
      console.log(`Skipping initial fade - too close to scheduled fade (${Math.round(msToNext / 1000)}s away)`);
    }

    // Expose functions globally for easy testing
    window.colorFade = {
      setNextColor,
      setAllNextColors,
      startFade,
      startFadeTransition,
      exampleRainbowFade,
      exampleRandomColors,
      letterColors,
      letterElements,
      triggerClockFade,
      calculateNextFadeTime,
      FADE_DURATION
    };

    // Log usage instructions
    console.log('Color fade system ready! Try:');
    console.log('colorFade.exampleRainbowFade() - Rainbow effect with animation');
    console.log('colorFade.exampleRandomColors() - Random colors with transition');
    console.log('colorFade.triggerClockFade() - Trigger a clock-based fade');
    console.log(`Clock fades scheduled every 5 minutes, ${FADE_DURATION / 1000}s duration`);
  </script>
</body>

</html>
